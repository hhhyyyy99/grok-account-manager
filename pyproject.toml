[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-account-manager"
version = "0.1.0"
description = "Local manager for Grok registration, account inspection, and batch login"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "gork-manager contributors" }]
dependencies = [
    "DrissionPage>=4.1",
    "curl_cffi>=0.7",
    "requests>=2.32",
]

[project.scripts]
grok-manager = "grok_manager.cli:main"

[tool.setuptools.packages.find]
include = ["grok_manager*", "grok_register*"]

[tool.setuptools.package-data]
grok_manager = [
    "registration_config.example.json",
    "web_assets/*.html",
    "web_assets/*.css",
    "web_assets/*.js",
]
grok_register = ["LICENSE.upstream", "turnstilePatch/*.js", "turnstilePatch/*.json"]
